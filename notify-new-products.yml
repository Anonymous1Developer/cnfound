name: Notify Discord of new products

on:
  push:
    branches: [main]
    paths:
      - 'index.html'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (with history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get previous version of index.html
        run: |
          if git cat-file -e ${{ github.event.before }}:index.html 2>/dev/null; then
            git show ${{ github.event.before }}:index.html > old_index.html
          else
            touch old_index.html
          fi

      - name: Diff and notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/notify-new-products.js old_index.html index.html
