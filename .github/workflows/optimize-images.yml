name: Auto-optimize new images

on:
  push:
    branches: [main]
    paths:
      - 'Images/**'

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install Pillow

      - name: Run image optimizer
        run: python3 scripts/optimize-images.py

      - name: Commit and push optimized images
        run: |
          git config user.name "CNFound Bot"
          git config user.email "cnfound-bot@users.noreply.github.com"
          git add images-opt/
          if git diff --cached --quiet; then
            echo "No new images to optimize"
          else
            git commit -m "Auto-optimize new product images to WebP"
            git push
          fi
